name: WDA Tests

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MIN_VM_IMAGE: macos-14
  MIN_XCODE_VERSION: "15.4"
  MIN_PLATFORM_VERSION: "17.5"
  MIN_TV_PLATFORM_VERSION: "17.5"
  MIN_TV_DEVICE_NAME: "Apple TV 4K (3rd generation)"
  MIN_WATCH_PLATFORM_VERSION: "10.5"
  MIN_WATCH_DEVICE_NAME: "Apple Watch Series 9 (45mm)"
  MIN_IPHONE_DEVICE_NAME: "iPhone 15 Plus"
  MIN_IPAD_DEVICE_NAME: "iPad Air 13-inch (M2)"
  MAX_VM_IMAGE: xcode-27
  MAX_XCODE_VERSION: "27.0-beta"
  MAX_PLATFORM_VERSION: "27.0"
  MAX_TV_PLATFORM_VERSION: "27.0"
  MAX_WATCH_PLATFORM_VERSION: "27.0"
  MAX_WATCH_DEVICE_NAME: "Apple Watch Series 11 (46mm)"
  MAX_IPHONE_DEVICE_NAME: "iPhone 17"
  MAX_TV_DEVICE_NAME: "Apple TV 4K (3rd generation)"
  MAX_IPAD_DEVICE_NAME: "iPad Air 11-inch (M2)"

jobs:
  build_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        # TEMPORARILY emptied to free up the shared 5-runner macOS pool while iterating on
        # watchOS integration test CI in #1216 - restore the full matrix once that's done.
        run: |
          cat <<'MATRIX_JSON' | jq -c . > matrix.json
          [
          ]
          MATRIX_JSON
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT

  analyze_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        # TEMPORARILY emptied - see build_matrix above.
        run: |
          cat <<'MATRIX_JSON' | jq -c . > matrix.json
          [
          ]
          MATRIX_JSON
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT

  unit_test_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        # TEMPORARILY emptied - see build_matrix above.
        run: |
          cat <<'MATRIX_JSON' | jq -c . > matrix.json
          [
          ]
          MATRIX_JSON
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT

  integration_test_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        # TEMPORARILY trimmed to just the watch_int_test entries - see build_matrix above.
        run: |
          cat <<'MATRIX_JSON' | jq -c . > matrix.json
          [
            {"name": "watch_int_test_Max_Xcode", "vm_image": "${{ env.MAX_VM_IMAGE }}", "xcode_version": "${{ env.MAX_XCODE_VERSION }}", "action": "watch_int_test", "dest": "watch", "sdk": "watch_sim", "watch_model": "${{ env.MAX_WATCH_DEVICE_NAME }}", "watch_version": "${{ env.MAX_WATCH_PLATFORM_VERSION }}"},
            {"name": "watch_int_test_Min_Xcode", "vm_image": "${{ env.MIN_VM_IMAGE }}", "xcode_version": "${{ env.MIN_XCODE_VERSION }}", "action": "watch_int_test", "dest": "watch", "sdk": "watch_sim", "watch_model": "${{ env.MIN_WATCH_DEVICE_NAME }}", "watch_version": "${{ env.MIN_WATCH_PLATFORM_VERSION }}"}
          ]
          MATRIX_JSON
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT

  build:
    needs: build_matrix
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.vm_image }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.build_matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/xcode-setup
        with:
          xcode_version: ${{ matrix.config.xcode_version }}
      - name: Build
        run: ./Scripts/build.sh
        env:
          ACTION: ${{ matrix.config.action }}
          TARGET: ${{ matrix.config.target }}
          SDK: ${{ matrix.config.sdk }}
          DEST: ${{ matrix.config.dest }}
          CODE_SIGN: ${{ matrix.config.code_sign }}
          IPHONE_MODEL: ${{ matrix.config.iphone_model }}
          IPAD_MODEL: ${{ matrix.config.ipad_model }}
          IOS_VERSION: ${{ matrix.config.ios_version }}
          TV_MODEL: ${{ matrix.config.tv_model }}
          TV_VERSION: ${{ matrix.config.tv_version }}
          WATCH_MODEL: ${{ matrix.config.watch_model }}
          WATCH_VERSION: ${{ matrix.config.watch_version }}

  analyze:
    needs: analyze_matrix
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.vm_image }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.analyze_matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/xcode-setup
        with:
          xcode_version: ${{ matrix.config.xcode_version }}
      - name: Analyze
        run: ./Scripts/build.sh
        env:
          ACTION: analyze
          TARGET: ${{ matrix.config.target }}
          SDK: ${{ matrix.config.sdk }}
          IPHONE_MODEL: ${{ matrix.config.iphone_model }}
          IPAD_MODEL: ${{ matrix.config.ipad_model }}
          IOS_VERSION: ${{ matrix.config.ios_version }}
          TV_MODEL: ${{ matrix.config.tv_model }}
          TV_VERSION: ${{ matrix.config.tv_version }}
          WATCH_MODEL: ${{ matrix.config.watch_model }}
          WATCH_VERSION: ${{ matrix.config.watch_version }}

  unit_test:
    needs: unit_test_matrix
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.vm_image }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.unit_test_matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/xcode-setup
        with:
          xcode_version: ${{ matrix.config.xcode_version }}
      - name: Run unit tests
        run: ./Scripts/build.sh
        env:
          ACTION: unit_test
          DEST: iphone
          TARGET: lib
          SDK: sim
          IPHONE_MODEL: ${{ matrix.config.iphone_model }}
          IPAD_MODEL: ${{ matrix.config.ipad_model }}
          IOS_VERSION: ${{ matrix.config.ios_version }}

  integration_test:
    needs: integration_test_matrix
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.vm_image }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.integration_test_matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/xcode-setup
        with:
          xcode_version: ${{ matrix.config.xcode_version }}
      # - name: Start iOS Simulator UI
      #   run: open -Fn "$(xcode-select --print-path)/Applications/Simulator.app"
      # - name: Prepare iOS simulator
      #   id: prepareSimulator
      #   uses: futureware-tech/simulator-action@v4
      #   with:
      #     model: "${{ matrix.config.dest == 'iphone' && matrix.config.iphone_model || matrix.config.ipad_model }}"
      #     os_version: "${{ matrix.config.ios_version }}"
      #     shutdown_after_job: false
      #     wait_for_boot: true
      # - name: Finalize iOS simulator boot
      #   run: xcrun --sdk iphonesimulator --show-sdk-version
      - name: Run integration test
        run: ./Scripts/build.sh
        env:
          ACTION: ${{ matrix.config.action }}
          DEST: ${{ matrix.config.dest }}
          TARGET: lib
          SDK: ${{ matrix.config.sdk }}
          IPHONE_MODEL: ${{ matrix.config.iphone_model }}
          IPAD_MODEL: ${{ matrix.config.ipad_model }}
          IOS_VERSION: ${{ matrix.config.ios_version }}
          TV_MODEL: ${{ matrix.config.tv_model }}
          TV_VERSION: ${{ matrix.config.tv_version }}
          WATCH_MODEL: ${{ matrix.config.watch_model }}
          WATCH_VERSION: ${{ matrix.config.watch_version }}
          SKIP_TESTING: ${{ startsWith(matrix.config.ios_version, '27.') && matrix.config.action == 'int_test_3' && 'IntegrationTests_3/FBForceTouchTests/testForceTap' || '' }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 600
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 2
